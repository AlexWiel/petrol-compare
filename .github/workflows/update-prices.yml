name: Spritpreise aktualisieren

on:
  schedule:
    # Stündlich zu einer krummen Minute (zur vollen Stunde ist GitHub am stärksten ausgelastet).
    # GitHub startet geplante Läufe oft Stunden verspätet – das Skript ruft daher nur ab, wenn im
    # aktuellen Zeitfenster (Wiener Zeit: 8–12, 12–16, 16–20 Uhr) noch kein Abruf erfolgt ist.
    - cron: "17 * * * *"
  workflow_dispatch: {}    # manuell über den "Actions"-Tab startbar – ruft immer ab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Preise abrufen
        run: node scripts/fetch-prices.mjs ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Änderungen committen
        if: ${{ !cancelled() }}  # Daten erfolgreicher Standorte auch bei einem Teilfehler speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Spritpreise aktualisiert: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main  # falls main inzwischen weitergegangen ist (z. B. gemergter PR)
          git push
